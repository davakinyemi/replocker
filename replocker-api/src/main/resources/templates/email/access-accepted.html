<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Request Accepted</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6">
    <p>Your access to report-collection <!--/*@thymesVar id="collectionName" type="java.lang.String"*/-->
    <strong th:text="${collectionName}"></strong> has been accepted!</p>

    <p style="margin-top: 20px">Access Token: <!--/*@thymesVar id="accessToken" type="java.lang.String"*/-->
    <span style="font-family: monospace; font-size: 18px" th:text="${accessToken}"></span></p>

    <p style="margin-top: 20px">Expires: <!--/*@thymesVar id="expiresAt" type="java.lang.String"*/-->
    <span th:text="${expiresAt}"></span></p>
</body>
</html>
