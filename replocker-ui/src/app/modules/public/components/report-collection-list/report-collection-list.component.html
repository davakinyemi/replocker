<ng-container>
  <mat-table [hidden]="dataSource.data.length === 0" [dataSource]="dataSource" matSort>
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by name">Collection</mat-header-cell>
      <mat-cell *matCellDef="let col">
        <button mat-button (click)="viewCollection(col)">
          {{ col.name }}
          <!-- <mat-icon *ngIf="col.locked">lock</mat-icon> -->
        </button>
      </mat-cell>
    </ng-container>

    <!-- Description Column -->
    <ng-container matColumnDef="description">
      <mat-header-cell *matHeaderCellDef>Description</mat-header-cell>
      <mat-cell *matCellDef="let col">{{ col.description || '-' }}</mat-cell>
    </ng-container>

    <!-- Date Column -->
    <ng-container matColumnDef="createdDate">
      <mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by date"> Date Created </mat-header-cell>
      <mat-cell *matCellDef="let col">{{ col.createdDate | date:'dd.MM.yyyy, HH:mm' }}</mat-cell>
    </ng-container>

    <!-- Reports Column -->
    <ng-container matColumnDef="reports">
      <mat-header-cell *matHeaderCellDef>Reports</mat-header-cell>
      <mat-cell *matCellDef="let col">{{ col.reportIds?.length || 0 }}</mat-cell>
    </ng-container>


    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <mat-header-cell *matHeaderCellDef>Access</mat-header-cell>
      <mat-cell *matCellDef="let col">
        <!-- <mat-chip [color]="col.locked ? 'warn' : 'primary'">
          {{ col.locked ? 'Locked' : 'Open' }}
        </mat-chip> -->
        <mat-icon *ngIf="col.locked" [color]="'warn'">lock</mat-icon>
        <mat-icon *ngIf="!col.locked" [color]="'primary'">lock_open</mat-icon>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
  </mat-table>

  <mat-paginator [hidden]="dataSource.data.length === 0" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons="true"></mat-paginator>
</ng-container>


<div *ngIf="isLoading" class="loading-overlay">
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
</div>

<div *ngIf="dataSource.data.length === 0 && !isLoading" class="no-results">
  <mat-icon>info</mat-icon> No report collections available
</div>
