services:
  postgres:
    container_name: postgres-sql-rpl
    image: postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${SPRING_BOOT_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_BOOT_DATASOURCE_PASSWORD}
      PGDATA: /var/lib/postgresql/data
      POSTGRES_MULTIPLE_DATABASES: replocker, keycloak_replocker
      # POSTGRES_DB: ${SPRING_BOOT_DATASOURCE_NAME}
    volumes:
      # - postgres:/data/postgres
      - postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - 5432:5432
    networks:
      - rpl-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_BOOT_DATASOURCE_USERNAME} -d ${KEYCLOAK_DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
  keycloak:
    container_name: keycloak-rpl
    image: quay.io/keycloak/keycloak:26.1.3
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 9090:8080
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: ${KEYCLOAK_DATABASE}
      KC_DB_URL: ${KEYCLOAK_DATABASE_URL}
      KC_DB_USERNAME: ${SPRING_BOOT_DATASOURCE_USERNAME}
      KC_DB_PASSWORD: ${SPRING_BOOT_DATASOURCE_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_HOSTNAME: localhost
      KEYCLOAK_PROXY: edge
    networks:
      - rpl-net
    command:
      - "start-dev"

networks:
  rpl-net:
    driver: bridge

volumes:
  postgres:
    driver: local
  keycloak:
    driver: local